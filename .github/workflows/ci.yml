name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:
    inputs:
      operation:
        description: Verification only, or an exact documentation redeployment from main
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy-documentation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: never

jobs:
  source:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.0.0"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run deps:locked
      - run: npm run metadata:check
      - run: node --test scripts/start-cover-checks.test.mjs
      - run: npm run typecheck
      - if: ${{ matrix.node != '24' }}
        run: npm test
      - if: ${{ matrix.node == '24' }}
        run: npm run test:coverage
      - run: npm run build

  package:
    name: Package on Node ${{ matrix.node }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.0.0"
          - "24.19.0"
          - "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run deps:locked
      - run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/package"
          npm run pack:verify -- --output "$RUNNER_TEMP/package"
          node scripts/build-mcpb.mjs \
            --catalog-evidence "$RUNNER_TEMP/package/catalog-evidence.json" \
            --output "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/package/*.tgz
            ${{ runner.temp }}/package/*.mcpb
            ${{ runner.temp }}/package/catalog-evidence.json
          if-no-files-found: error
          retention-days: 1

  container:
    name: Hardened OCI image
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - run: npm run deps:locked
      - name: Verify restricted container and MCP contract
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/container"
          npm run container:verify -- --output "$RUNNER_TEMP/container"
          npm run container:index:verify -- \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/container"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence
          path: |
            ${{ runner.temp }}/container/Dockerfile
            ${{ runner.temp }}/container/catalog-evidence.json
            ${{ runner.temp }}/container/container-evidence.json
            ${{ runner.temp }}/container/oci-index-evidence.json
          if-no-files-found: error
          retention-days: 1

  package-identity:
    name: Cross-runtime package identity
    needs:
      - package
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-node-*
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-evidence
          path: container
      - name: Require byte-identical package payloads
        run: |
          set -eu
          set -- packages/package-node-*/*.tgz
          test "$#" -eq 3
          reference="$1"
          shift
          reference_tar="$RUNNER_TEMP/reference.tar"
          candidate_tar="$RUNNER_TEMP/candidate.tar"
          gzip -dc "$reference" > "$reference_tar"
          for candidate in "$@"
          do
            gzip -dc "$candidate" > "$candidate_tar"
            cmp "$reference_tar" "$candidate_tar"
          done
          set -- packages/package-node-*/catalog-evidence.json
          test "$#" -eq 3
          evidence_reference="$1"
          shift
          for candidate in "$@"
          do
            cmp "$evidence_reference" "$candidate"
          done
          set -- packages/package-node-*/*.mcpb
          test "$#" -eq 3
          bundle_reference="$1"
          shift
          for candidate in "$@"
          do
            cmp "$bundle_reference" "$candidate"
          done
          cmp "$evidence_reference" container/catalog-evidence.json

  security:
    name: Dependency security
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:check
      - run: npm run --silent sbom > /dev/null

  documentation:
    name: Documentation portal
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm run deps:locked
      - run: npm run build
      - run: npm run deps:locked
        working-directory: site
      - run: npm run security:check
        working-directory: site
      - run: npm run browser:install:ci
        working-directory: site
      - run: npm run verify
        working-directory: site
      - run: npm run deploy:dry-run
        working-directory: site
      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify') }}
        run: npm run test:evidence-links
        working-directory: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-portal
          path: site/dist
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - source
      - cover
      - package
      - container
      - package-identity
      - documentation
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          COVER_RESULT: ${{ needs.cover.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_IDENTITY_RESULT: ${{ needs.package-identity.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          set -eu
          test "$COVER_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$CONTAINER_RESULT" = success
          test "$PACKAGE_IDENTITY_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          test "$SECURITY_RESULT" = success

  workers:
    name: Publish documentation portal
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-documentation')) && github.ref == 'refs/heads/main' && needs.gate.result == 'success' }}
    needs: gate
    environment:
      name: documentation
      url: https://docs.guildcontrol.lasers.app
    permissions:
      actions: read # Download only this run's verified portal
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm run deps:locked
        working-directory: site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-portal
          path: site/dist
      - name: Deploy exact verified documentation artifact
        run: npm run deploy -- --message "GitHub Actions ${GITHUB_SHA}"
        working-directory: site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
      - name: Verify exact public documentation
        run: |
          set -eu
          node scripts/check-public-documentation.mjs \
            --manifest site/dist/generated/docs-manifest.json \
            --attempts 6 \
            --delay-ms 10000

  cover:
    name: Build project cover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm run deps:locked
      - run: npm --prefix site run deps:locked
      - run: npm --prefix site run browser:install:ci
      - run: npm --prefix site run capture:cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [gate, cover]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: docs/screenshots
      - name: Open an automatically merged cover pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COVER_WORKFLOWS: ci.yml,codeql.yml
        run: |
          set -eu
          gh auth setup-git --hostname github.com
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          branch="automation/project-cover-${GITHUB_SHA}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "$branch"
            changed_paths="$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD)"
            test "$changed_paths" = docs/screenshots/cover.png
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/screenshots/cover.png
            git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
            git push origin "HEAD:$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            body_file="$RUNNER_TEMP/cover-pr.md"
            cat > "$body_file" <<EOF
          Refresh the project cover from the verified source build. This pull request changes only the generated screenshot.

          Capture: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            pr_url="$(gh pr create --base main --head "$branch" --title 'docs: refresh generated project cover' --body-file "$body_file")"
          fi
          pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          node scripts/start-cover-checks.mjs "$pr_number"
          gh pr merge "$pr_url" --auto --squash
